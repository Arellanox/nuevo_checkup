<div class="modal fade" id="modalEstudiosInformacion"
     data-bs-backdrop="static"
     data-bs-keyboard="false"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
         style="max-width:90%;">

        <div class="modal-content">

            <!-- HEADER -->
            <div class="modal-header header-modal">
                <h5 class="modal-title">
                    Información de Estudios
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>


            <!-- BODY -->
            <div class="modal-body">

                <!-- BUSCADOR -->
                <form id="FormEstudioBuscar">

                    <div class="row mb-4">

                        <div class="col-md-8">

                            <label class="form-label">
                                Buscar estudio
                            </label>

                            <input type="text"
                                   name="estudio"
                                   class="form-control input-form"
                                   placeholder="Escriba el nombre del estudio..."
                                   autocomplete="off"
                                   required>

                        </div>

                    </div>

                </form>


                <div class="row">


                    <!-- LISTADO DE ESTUDIOS -->
                    <div class="col-lg-3">

                        <div id="listEstudios" class="d-none">

                            <div class="card shadow-sm">

                                <div class="card-header">

                                    <strong>
                                        Estudios encontrados
                                    </strong>

                                </div>

                                <div class="card-body p-2">

                                    <div id="suggestionsListEstudios"
                                         style="max-height:650px;
                                         overflow-y:auto;">

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- INFORMACIÓN -->
                    <div class="col-lg-9"
                         id="info_estudios-search"
                         style="display:none;">


                        <!-- CABECERA DEL ESTUDIO -->
                        <div class="study-header mb-4">

                            <h2 id="InfoModal_DESCRIPCION"></h2>

                            <p class="mb-1">

                                Área:
                                <strong id="InfoModal_AREA"></strong>

                            </p>

                            <p class="mb-0">

                                Clasificación:
                                <strong id="InfoModal_CLASIFICACION"></strong>

                            </p>

                        </div>


                        <!-- TABS -->
                        <ul class="nav nav-tabs mb-3"
                            id="tabsEstudios"
                            role="tablist">


                            <li class="nav-item">

                                <button class="nav-link active"
                                        data-bs-toggle="tab"
                                        data-bs-target="#general">

                                    Información General

                                </button>

                            </li>


                            <li class="nav-item">

                                <button class="nav-link"
                                        data-bs-toggle="tab"
                                        data-bs-target="#paciente">

                                    Paciente

                                </button>

                            </li>


                            <li class="nav-item">

                                <button class="nav-link"
                                        data-bs-toggle="tab"
                                        data-bs-target="#laboratorio">

                                    Laboratorio

                                </button>

                            </li>


                            <li class="nav-item">

                                <button class="nav-link"
                                        data-bs-toggle="tab"
                                        data-bs-target="#referencias">

                                    Valores Ref.

                                </button>

                            </li>


                            <li class="nav-item">

                                <button class="nav-link"
                                        data-bs-toggle="tab"
                                        data-bs-target="#grupos">

                                    Grupos

                                </button>

                            </li>

                        </ul>



                        <!-- CONTENIDO DE LAS PESTAÑAS -->
                        <div class="tab-content">



                            <!-- GENERAL -->
                            <div class="tab-pane fade show active"
                                 id="general">

                                <div class="row">


                                    <div class="col-md-4 mb-3">

                                        <div class="card-info">

                                            <small>Tiempo de entrega</small>

                                            <h5 id="InfoModal_DIAS_DE_ENTREGA">
                                            </h5>

                                        </div>

                                    </div>


                                    <div class="col-md-4 mb-3">

                                        <div class="card-info">

                                            <small>Tipo de muestra</small>

                                            <h5 id="InfoModal_MUESTRA">
                                            </h5>

                                        </div>

                                    </div>



                                    <div class="col-md-4 mb-3">

                                        <div class="card-info">

                                            <small>Contenedor</small>

                                            <h5 id="InfoModal_CONTENEDOR">
                                            </h5>

                                        </div>

                                    </div>



                                    <div class="col-md-4 mb-3">

                                        <div class="card-info">

                                            <small>Código SAT</small>

                                            <h5 id="InfoModal_CODIGO_SAT">
                                            </h5>

                                        </div>

                                    </div>



                                    <div class="col-md-4 mb-3">

                                        <div class="card-info">

                                            <small>Medida</small>

                                            <h5 id="InfoModal_MEDIDA">
                                            </h5>

                                        </div>

                                    </div>



                                    <div class="col-md-4 mb-3">

                                        <div class="card-info">

                                            <small>Activo</small>

                                            <h5 id="InfoModal_ACTIVO">
                                            </h5>

                                        </div>

                                    </div>

                                </div>

                            </div>




                            <!-- PACIENTE -->
                            <div class="tab-pane fade"
                                 id="paciente">


                                <div class="accordion"
                                     id="accordionPaciente">


                                    <div class="accordion-item">

                                        <h2 class="accordion-header">

                                            <button class="accordion-button"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target="#indicaciones">

                                                Indicaciones para el paciente

                                            </button>

                                        </h2>


                                        <div id="indicaciones"
                                             class="accordion-collapse collapse show">

                                            <div class="accordion-body"
                                                 id="InfoModal_INDICACIONES">

                                            </div>

                                        </div>

                                    </div>




                                    <div class="accordion-item">

                                        <h2 class="accordion-header">

                                            <button class="accordion-button collapsed"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target="#conservacion">

                                                Conservación

                                            </button>

                                        </h2>


                                        <div id="conservacion"
                                             class="accordion-collapse collapse">

                                            <div class="accordion-body"
                                                 id="InfoModal_CONSERVACION">

                                            </div>

                                        </div>

                                    </div>


                                </div>

                            </div>





                            <!-- LABORATORIO -->
                            <div class="tab-pane fade"
                                 id="laboratorio">


                                <div class="accordion">


                                    <div class="accordion-item">

                                        <h2 class="accordion-header">

                                            <button class="accordion-button"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target="#lab1">

                                                Indicaciones del Laboratorio

                                            </button>

                                        </h2>


                                        <div class="accordion-collapse collapse show"
                                             id="lab1">

                                            <div class="accordion-body"
                                                 id="InfoModal_INDICACIONES_LABORATORIO">

                                            </div>

                                        </div>

                                    </div>




                                    <div class="accordion-item">

                                        <h2 class="accordion-header">

                                            <button class="accordion-button collapsed"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target="#lab2">

                                                Motivos de rechazo

                                            </button>

                                        </h2>


                                        <div class="accordion-collapse collapse"
                                             id="lab2">

                                            <div class="accordion-body"
                                                 id="InfoModal_MOTIVO_RECHAZO">

                                            </div>

                                        </div>

                                    </div>




                                    <div class="accordion-item">

                                        <h2 class="accordion-header">

                                            <button class="accordion-button collapsed"
                                                    data-bs-toggle="collapse"
                                                    data-bs-target="#lab3">

                                                Metodología

                                            </button>

                                        </h2>


                                        <div class="accordion-collapse collapse"
                                             id="lab3">

                                            <div class="accordion-body"
                                                 id="InfoModal_METODOLOGIA_NOMBRE">

                                            </div>

                                        </div>

                                    </div>


                                </div>


                            </div>




                            <!-- VALORES -->
                            <div class="tab-pane fade"
                                 id="referencias">

                                <div class="table-responsive">

                                    <table class="table table-striped table-hover">

                                        <thead>

                                        <tr>

                                            <th>Sexo</th>
                                            <th>Edad</th>
                                            <th>Valor mínimo</th>
                                            <th>Valor máximo</th>

                                        </tr>

                                        </thead>

                                        <tbody id="tabla_valores_referencia">

                                        </tbody>

                                    </table>

                                </div>

                            </div>




                            <!-- GRUPOS -->
                            <div class="tab-pane fade"
                                 id="grupos">


                                <div class="card shadow-sm">

                                    <div class="card-body">

                                        <div id="lista_grupos">

                                            <!-- GRUPOS -->

                                        </div>

                                    </div>

                                </div>


                            </div>



                        </div>

                    </div>

                </div>


            </div>



            <!-- FOOTER -->
            <div class="modal-footer">

                <button type="button"
                        class="btn btn-cancelar"
                        data-bs-dismiss="modal">

                    <i class="bi bi-arrow-left-short"></i>
                    Cerrar

                </button>

            </div>

        </div>

    </div>

</div>



<style>

    .study-header{

        background:linear-gradient(
                135deg,
                #004E59,
                #006C7A
        );

        color:white;
        padding:25px;
        border-radius:15px;

    }


    .study-header h2{

        margin-bottom:10px;
        font-weight:bold;

    }


    .card-info{

        background:#FFF;
        padding:20px;
        border-radius:15px;
        box-shadow:0 3px 10px rgba(0,0,0,.08);
        height:100%;

    }


    .card-info small{

        color:#7B7B7B;
        font-weight:600;

    }


    .card-info h5{

        margin-top:10px;
        color:#004E59;
        font-weight:bold;
        word-break:break-word;

    }



    #suggestionsListEstudios{

        overflow-x:hidden;

    }


    .estudios_encontrados{

        cursor:pointer;

    }


    .nav-tabs .nav-link{

        font-weight:600;

    }


    .accordion-button{

        font-weight:600;

    }


    .accordion-body{

        white-space:pre-line;

    }


</style>



<script>

    html_estudios_info = $('#info_estudios-search').html();

</script>
